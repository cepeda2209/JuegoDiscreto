// Configuración común a los tres módulos
subprojects {
    apply plugin: 'java'

    group = 'com.graphsyndicate'
    version = '0.1.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    repositories {
        mavenCentral()
    }
}
